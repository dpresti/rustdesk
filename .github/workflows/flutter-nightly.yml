name: Flutter Nightly Build

on:
  # Fork note: daily cron disabled - this fork only builds a custom Windows
  # client (rustdesk.presti.page baked in) on manual trigger, not nightly.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
